name: WistJeDatDieren lange video (Top 10)

on:
  schedule:
    - cron: "10 11 * * 1,3,5"     # ma, wo, vr 11:10 UTC; gepubliceerd om 17:00 NL
    - cron: "10 13 * * 1,3,5"     # tweede poging; doet niets als de eerste is gelukt
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen maken, niet uploaden (testen)"
        type: boolean
        default: false
      mode:
        description: "Publicatie"
        type: choice
        options: [scheduled, public, private]
        default: scheduled
      theme:
        description: "Eigen thema (leeg = automatisch kiezen)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: wjd-long
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: wjd_long/requirements.txt
      - name: Systeempakketten
        run: for i in 1 2 3; do sudo apt-get update && sudo apt-get install -y ffmpeg && exit 0; sleep 30; done; exit 1
      - run: pip install -r wjd_long/requirements.txt
      - name: Video maken en uploaden
        working-directory: wjd_long
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.TRR_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.TRR_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
          WJD_YT_REFRESH_TOKEN: ${{ secrets.WJD_YT_REFRESH_TOKEN }}
          PUBLISH_MODE: ${{ github.event.inputs.mode || 'scheduled' }}
          THEME: ${{ github.event.inputs.theme }}
        run: |
          ARGS=()
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && ARGS+=(--force)
          [ -n "$THEME" ] && ARGS+=(--theme "$THEME")
          python -m wjdlong.main "${ARGS[@]}"
      - name: Testvideo bewaren (alleen bij dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: testvideo
          path: |
            wjd_long/work/final.mp4
            wjd_long/work/thumbnail.jpg
            wjd_long/work/description.txt
            wjd_long/work/story.json
          retention-days: 3
      - name: Geschiedenis opslaan
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "wjd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add wjd_long/wjd_long_history.json
          git diff --cached --quiet || (git commit -m "Lange video geregistreerd" && git push)
