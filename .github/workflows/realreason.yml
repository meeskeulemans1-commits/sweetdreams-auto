name: TheRealReasonBehindThings - dagelijkse Shorts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen maken, niet uploaden (testen)"
        type: boolean
        default: false
      mode:
        description: "Publicatie"
        type: choice
        options: [scheduled, public, private]
        default: scheduled
      slot_hour:
        description: "Uur (NL) waarop de video verschijnt"
        default: "18"

permissions:
  contents: write

concurrency:
  group: realreason
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Controle (draait alleen als alles klaar staat)
        id: chk
        env:
          TOKEN: ${{ secrets.TRR_REFRESH_TOKEN }}
        run: |
          if [ -f trr_bundle.b64 ] && { [ -n "$TOKEN" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; }; then echo "ready=true" >> $GITHUB_OUTPUT; else echo "ready=false" >> $GITHUB_OUTPUT; echo "Nog niet klaar: trr_bundle.b64 of TRR_REFRESH_TOKEN ontbreekt"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Code uitpakken
        if: steps.chk.outputs.ready == 'true'
        run: |
          mkdir -p trr && base64 -d trr_bundle.b64 | tar xz -C trr
          if [ -f trr_history.json ]; then cp trr_history.json trr/history.json; fi
          sed -i "s/, temperature=temperature//" trr/realreason/story.py
      - name: Systeempakketten
        if: steps.chk.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python-pakketten
        if: steps.chk.outputs.ready == 'true'
        working-directory: trr
        run: pip install -r requirements.txt
      - name: Playwright (headless Chromium)
        if: steps.chk.outputs.ready == 'true'
        working-directory: trr
        run: |
          npm init -y >/dev/null && npm i playwright@1.49.1 three@0.128.0 >/dev/null
          cp node_modules/three/build/three.min.js engine/three.min.js
          mkdir -p assets && curl -sL -o assets/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          cp assets/Poppins-Bold.ttf engine/Poppins-Bold.ttf
          npx playwright install --with-deps chromium
      - name: Stemmodel in cache
        if: steps.chk.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: trr/models
          key: kokoro-v1.0
      - name: Video maken en uploaden
        if: steps.chk.outputs.ready == 'true'
        working-directory: trr
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.TRR_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.TRR_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
          TRR_REFRESH_TOKEN: ${{ secrets.TRR_REFRESH_TOKEN }}
          PUBLISH_MODE: ${{ github.event.inputs.mode || 'scheduled' }}
          NODE_PATH: ${{ github.workspace }}/trr/node_modules
        run: |
          if [ -n "${{ github.event.inputs.slot_hour }}" ]; then H="${{ github.event.inputs.slot_hour }}";
          elif [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then H=21; else H=18; fi
          export SLOT_HOUR=$H
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; else FLAG=""; fi
          python -m realreason.main $FLAG
      - name: Testvideo bewaren (alleen bij dry-run)
        if: ${{ steps.chk.outputs.ready == 'true' && github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: testvideo
          path: |
            trr/work/final.mp4
            trr/work/thumbnail.jpg
            trr/work/description.txt
          retention-days: 3
      - name: Geschiedenis opslaan
        if: ${{ steps.chk.outputs.ready == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          cp trr/history.json trr_history.json
          git config user.name "realreason-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trr_history.json
          git diff --cached --quiet || (git commit -m "Nieuwe Short geregistreerd" && git pull --rebase && git push)
