name: Token test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Werkt de Sweet Dreams-sleutel nog?
        env:
          CID: ${{ secrets.YT_CLIENT_ID }}
          CS: ${{ secrets.YT_CLIENT_SECRET }}
          RT: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -d client_id="$CID" -d client_secret="$CS" -d refresh_token="$RT" -d grant_type=refresh_token https://oauth2.googleapis.com/token)
          echo "HTTP $code"
          if grep -q access_token out.json; then echo "RESULTAAT: SLEUTEL WERKT"; else echo "RESULTAAT: SLEUTEL WERKT NIET"; sed 's/"[^"]*token[^"]*": *"[^"]*"/(token weggelaten)/' out.json; exit 1; fi
