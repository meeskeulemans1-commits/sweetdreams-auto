name: Dagelijkse slaapverhaal-video

on:
  schedule:
    - cron: "17 11,13 * * *"      # 11:17 en 13:17 UTC; de tweede run doet niets als de eerste is gelukt
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen maken, niet uploaden (testen)"
        type: boolean
        default: false
      mode:
        description: "Publicatie"
        type: choice
        options: [scheduled, public, private]
        default: scheduled
      minutes:
        description: "Lengte van het verhaal (45 of 60 voor een lange testvideo; 0 = normaal, ongeveer 22 minuten)"
        type: choice
        options: ["0", "45", "60"]
        default: "0"

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Systeempakketten
        run: for i in 1 2 3; do sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core && exit 0; sleep 30; done; exit 1
      - run: pip install -r requirements.txt
      - name: Stemmodel in cache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Video maken en uploaden
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH_MODE: ${{ github.event.inputs.mode || 'scheduled' }}
          LONG_MINUTES: ${{ github.event.inputs.minutes || '0' }}
        run: |
          if [ "$LONG_MINUTES" = "45" ]; then export MIN_WORDS=4300 MAX_WORDS=5300 MIN_CH=13 MAX_CH=20 MIN_MINUTES=38 MAX_MINUTES=62; fi
          if [ "$LONG_MINUTES" = "60" ]; then export MIN_WORDS=5700 MAX_WORDS=6700 MIN_CH=16 MAX_CH=24 MIN_MINUTES=50 MAX_MINUTES=80; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; else FLAG=""; fi
          python -m sleepstories.main $FLAG $([ "${{ github.event_name }}" = "workflow_dispatch" ] && echo --force)
      - name: Testvideo bewaren (alleen bij dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: testvideo
          path: |
            work/final.mp4
            work/thumbnail.jpg
            work/description.txt
          retention-days: 2
      - name: Geschiedenis opslaan
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "sweetdreams-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Nieuwe video geregistreerd" && git push)
